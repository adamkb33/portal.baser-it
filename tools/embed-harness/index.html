<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pitell Embed Harness</title>
    <style>
      body {
        margin: 0;
        font-family: Georgia, serif;
        background: #faf6f0;
        color: #222;
      }

      .page {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px;
      }

      .filler {
        height: 60vh;
        background: linear-gradient(#eee, #faf6f0);
      }

      iframe {
        display: block;
        width: 1px;
        min-width: 100%;
        height: 720px;
        border: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>Fake Client Site</h1>
      <p>Content above the booking flow, to test parent scroll coordination.</p>
      <div class="filler"></div>

      <iframe
        id="booking"
        src="http://localhost:5173/embed?companyId=123&theme=fredrikstad-barbershop&parentOrigin=http://localhost:8080"
        title="Bestill time"
        scrolling="no"
        allowtransparency="true"
      ></iframe>

      <div class="filler"></div>
      <p>Content below the booking flow.</p>
    </main>

    <script>
      const frame = document.getElementById('booking');
      const childOrigin = 'http://localhost:5173';

      window.addEventListener('message', (event) => {
        if (event.origin !== childOrigin) return;

        const message = event.data;
        if (!message || typeof message !== 'object') return;

        if (message.type === 'embed:resize' && Number.isFinite(message.height)) {
          frame.style.height = `${Math.max(320, Math.ceil(message.height))}px`;
        }

        if (message.type === 'embed:step-changed') {
          window.requestAnimationFrame(() => {
            const top = frame.getBoundingClientRect().top + window.scrollY - 16;
            window.scrollTo({ top, behavior: 'smooth' });
          });
        }

        console.log('[embed]', message);
      });
    </script>
  </body>
</html>
